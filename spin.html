<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dancing Hearts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fbf3f4; color: #3d2329;
    display: flex; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  main { width: 100%; max-width: 420px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { text-align: center; font-size: 26px; color: #a14f68; }
  .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; }
  #card {
    aspect-ratio: 3 / 4; width: 100%; border-radius: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 120px; color: #fff; cursor: pointer; position: relative;
  }
  #card small { font-size: 16px; opacity: .85; margin-top: 8px; }
  #hint { text-align: center; font-size: 22px; font-weight: 700; min-height: 30px; }
  #bar { height: 14px; background: #ecd5d9; border-radius: 7px; overflow: hidden; }
  #fill { height: 100%; width: 100%; background: #a14f68; }
  #answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-size: 20px; font-weight: 700; padding: 18px 8px;
    border: 0; border-radius: 16px; background: #fff; color: #3d2329;
    box-shadow: 0 2px 0 #cea5ae; cursor: pointer;
  }
  button.ok { background: #4c9a5f; color: #fff; }
  button.bad { background: #b9473f; color: #fff; }
  #end { text-align: center; display: none; flex-direction: column; gap: 16px; padding-top: 40px; }
  #end .big { font-size: 64px; font-weight: 800; color: #a14f68; }
  .hidden { visibility: hidden; }
</style>
</head>
<body>
<main>
  <h1>💖 Dancing Hearts</h1>

  <div id="game">
    <div class="top"><span id="round">1 / 5</span><span id="score">0 b.</span></div>
    <div id="card" style="margin-top:14px"></div>
    <div id="hint" style="margin-top:14px">Ťukni!</div>
    <div id="bar" class="hidden" style="margin-top:10px"><div id="fill"></div></div>
    <div id="answers" style="margin-top:14px"></div>
  </div>

  <div id="end">
    <div>Koniec! Tvoje body:</div>
    <div class="big" id="final">0</div>
    <button id="again">Hrať znova</button>
  </div>
</main>

<script>
// ---- Content (later this will come from the Google Sheet) ----
// For now: placeholder colours instead of photos, youngest group only.
const POSITIONS = [
  { name: "Plié",        color: "#c09a93" },
  { name: "Relevé",      color: "#dc896f" },
  { name: "Tendu",       color: "#cea5ae" },
  { name: "Passé",       color: "#bc8390" },
  { name: "Arabesque",   color: "#e6ab96" },
  { name: "Sauté",       color: "#a14f68" },
  { name: "1. pozícia",  color: "#c09a93" },
  { name: "2. pozícia",  color: "#bc8390" },
];
const SECONDS = 8;   // youngest group
const ROUNDS = 5;

// ---- Game ----
const $ = id => document.getElementById(id);
let round, score, used, current, spinTimer, clock, state;

function shuffle(a) { return a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]); }

function showCard(p, label) {
  $("card").style.background = p.color;
  $("card").innerHTML = "💃<small>" + label + "</small>";
}

function start() {
  round = 0; score = 0; used = [];
  $("end").style.display = "none"; $("game").style.display = "block";
  nextRound();
}

function nextRound() {
  round++;
  $("round").textContent = round + " / " + ROUNDS;
  $("score").textContent = score + " b.";
  $("answers").innerHTML = "";
  $("bar").classList.add("hidden");
  $("hint").textContent = "Ťukni!";
  state = "spinning";
  let i = 0;
  spinTimer = setInterval(() => { showCard(POSITIONS[i++ % POSITIONS.length], ""); }, 90);
}

function stop() {
  if (state !== "spinning") return;
  clearInterval(spinTimer);
  state = "asking";
  const left = POSITIONS.filter(p => !used.includes(p));
  current = left[Math.floor(Math.random() * left.length)];
  used.push(current);
  showCard(current, "(test: " + current.name + ")");
  $("hint").textContent = "Ako sa to volá?";

  const wrong = shuffle(POSITIONS.filter(p => p !== current)).slice(0, 3);
  $("answers").innerHTML = "";
  shuffle([current, ...wrong]).forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.name;
    b.onclick = () => answer(p, b);
    $("answers").appendChild(b);
  });

  // time bar
  $("bar").classList.remove("hidden");
  const t0 = Date.now();
  clock = setInterval(() => {
    const leftPart = 1 - (Date.now() - t0) / (SECONDS * 1000);
    $("fill").style.width = Math.max(0, leftPart * 100) + "%";
    if (leftPart <= 0) answer(null, null);
  }, 50);
}

function answer(p, btn) {
  if (state !== "asking") return;
  state = "done";
  clearInterval(clock);
  const leftPart = parseFloat($("fill").style.width) / 100 || 0;
  const buttons = [...$("answers").children];
  buttons.forEach(b => { if (b.textContent === current.name) b.classList.add("ok"); });

  if (p === current) {
    const points = 100 + Math.round(leftPart * 100);  // faster = more points
    score += points;
    $("hint").textContent = "Správne! +" + points;
  } else {
    if (btn) btn.classList.add("bad");
    $("hint").textContent = p ? "Nie, je to: " + current.name : "Čas vypršal! Je to: " + current.name;
  }
  $("score").textContent = score + " b.";
  setTimeout(() => (round < ROUNDS ? nextRound() : finish()), 1800);
}

function finish() {
  $("game").style.display = "none";
  $("end").style.display = "flex";
  $("final").textContent = score;
}

$("card").onclick = stop;
$("again").onclick = start;
start();
</script>
</body>
</html>
